server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/connectsphere_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - profile
              - email
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port: ${SERVER_PORT:8081}
    prefer-ip-address: false
    home-page-url: http://${eureka.instance.hostname}:${server.port}/
    status-page-url: http://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: http://${eureka.instance.hostname}:${server.port}/actuator/health
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

connectsphere:
  jwt:
    secret: ${JWT_SECRET:change-this-local-dev-secret}
    expiry-hours: 24
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@connectsphere.local}
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@12345}
      full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:ConnectSphere Admin}
      sync-password-on-startup: ${ADMIN_BOOTSTRAP_SYNC_PASSWORD:true}
  oauth2:
    frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:4200/login}
  mail:
    from: ${CONNECTSPHERE_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  auth:
    reset-password:
      frontend-url: ${RESET_PASSWORD_FRONTEND_URL:http://localhost:4200/reset-password}

# URL for calling search-service when a new user registers
services:
  search-url: ${SEARCH_SERVICE_URL:http://localhost:8084}
  media-url: ${MEDIA_SERVICE_URL:http://localhost:8083}
