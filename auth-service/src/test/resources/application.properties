# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:authtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Eureka (no server running during tests)
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# OAuth2 dummy values (required by Spring Boot config, but not used in tests)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Search service URL (won't be called — mocked with @MockBean)
services.search-url=http://localhost:9999

# JWT config (must match keys in JwtService)
connectsphere.jwt.secret=test-secret-key-for-testing-must-be-long-enough-min-32-chars
connectsphere.jwt.expiry-hours=24
