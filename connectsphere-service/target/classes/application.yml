server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: connectsphere-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/connectsphere_posts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:post_user}
    password: ${SPRING_DATASOURCE_PASSWORD:post_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port: ${SERVER_PORT:8082}
    prefer-ip-address: false
    home-page-url: http://${eureka.instance.hostname}:${server.port}/
    status-page-url: http://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: http://${eureka.instance.hostname}:${server.port}/actuator/health
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# URLs for calling other microservices
# These use Eureka service names (http://service-name) when running with Docker
# In local dev without Eureka, replace with actual URLs like http://localhost:8084
services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  media-url: ${MEDIA_SERVICE_URL:http://localhost:8083}
  search-url: ${SEARCH_SERVICE_URL:http://localhost:8084}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

connectsphere:
  rabbitmq:
    notification-exchange: ${CONNECTSPHERE_NOTIFICATION_EXCHANGE:connectsphere.notification.exchange}
    notification-queue: ${CONNECTSPHERE_NOTIFICATION_QUEUE:connectsphere.notification.queue}
    notification-routing-key: ${CONNECTSPHERE_NOTIFICATION_ROUTING_KEY:connectsphere.notification.created}
