# Use H2 in-memory database for tests — no MySQL needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Eureka — we don't want it connecting to a real Eureka server during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Service URLs — won't be called in tests because we use @MockBean
services.search-url=http://localhost:9999
services.notification-url=http://localhost:9998
